services:
  - type: web
    name: idda-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: idda-postgres
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      - key: LOAD_OPEN_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: https://idda-transit.vercel.app,http://localhost:5173
databases:
  - name: idda-postgres
    plan: free
    databaseName: idda
    user: idda
